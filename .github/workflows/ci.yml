name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run
      - run: npm run build

  migrate:
    # Apply new supabase/migrations/*.sql to the hosted project after tests pass on main.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: snzgotquolwdbdnmbdov
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # the game rules, bundled for the game server
      - run: npm run build:functions
      - uses: supabase/setup-cli@v1
        with: { version: 3.2.0 }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote --include-all --yes
      # the AI-assistant (MCP) endpoint; it checks its own link tokens
      - run: supabase functions deploy quex-mcp --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
      # the game server: holds each world's state and checks every action
      - run: supabase functions deploy quex-act --remote="$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api --yes
